name: Actualizar Radar

on:
  schedule:
    - cron: "11 * * * *"     # cada hora
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Siempre se trabaja sobre la última versión (también al usar "Re-run jobs")
      - name: Usar la última versión del repositorio
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install feedparser

      - name: Buscar y puntuar noticias
        run: python build.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Guardar news.json en el repositorio
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add news.json
          git commit -m "Noticias actualizadas" || echo "Sin cambios"
          for i in 1 2 3; do
            git push origin main && break
            git fetch --depth=1 origin main && git rebase -X theirs origin/main || git rebase --abort
          done

      - uses: actions/configure-pages@v5

      # Nombre único por intento: así "Re-run jobs" no choca con el archivo del intento anterior
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Esperar antes de reintentar la publicación
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

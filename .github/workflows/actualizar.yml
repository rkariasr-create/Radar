name: Actualizar Radar

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install feedparser

      - name: Buscar y puntuar noticias
        run: python build.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Guardar news.json en el repositorio
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add news.json
          git commit -m "Noticias actualizadas" || echo "Sin cambios"
          git push || echo "No se pudo guardar (no es grave)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
